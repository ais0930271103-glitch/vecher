name: Проверки приложения

on:
  pull_request:
    paths: ["app/**", ".github/workflows/app-checks.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-checks.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.7", channel: stable, cache: true }
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
