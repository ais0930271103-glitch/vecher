name: vecher_app
description: "Вечер — приватное приложение для двоих."
publish_to: "none"
version: 0.9.0+14

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  crypto: 3.0.7
  centrifuge: 0.20.1
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  firebase_core: '>=3.6.0 <6.0.0'
  firebase_messaging: '>=15.1.0 <18.0.0'
  share_plus: ^10.1.0
  url_launcher: ^6.3.0
  package_info_plus: '>=8.0.0 <10.0.0'
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  file_picker: 11.0.3
  flutter_webrtc: 1.6.2+hotfix.4
  video_player: 2.14.1
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_secure_storage_platform_interface: 1.1.2
  firebase_core_platform_interface: 8.1.1
  flutter_launcher_icons: ^0.14.1

# Иконка приложения: полумесяц со звёздочкой (по продуктовому документу — без силуэтов пары).
# Обновить иконки: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#16141F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/emblem.png
    - assets/fonts/OFL-Manrope.txt
    - assets/fonts/OFL-Comfortaa.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa-Regular.ttf
          weight: 400
